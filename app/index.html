<style>
:root{--bg:#f2f2f7;--card:#fff;--fg:#111;--mut:#6b7280;--line:#e5e7eb;--pri:#2563eb;--danger:#dc2626;--n:#2563eb;--l:#dc2626;--r:#16a34a;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#f5f5f7;--mut:#9ca3af;--line:#2c2c2e;--pri:#3b82f6}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
main#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 8px) 16px 24px;max-width:720px;width:100%;margin:0 auto}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tab{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{font-size:20px;filter:grayscale(1);opacity:.7}.tab.on{color:var(--pri)}.tab.on .ic{filter:none;opacity:1}
h1{font-size:28px;margin:6px 0}h3{margin:4px 0 10px}h4{margin:16px 0 4px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}.row.end{justify-content:flex-end;margin-top:14px}.row.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;background:var(--line);color:var(--fg);font-weight:500}
.btn:active{opacity:.7}.btn.primary{background:var(--pri);color:#fff}.btn.danger{background:#fee2e2;color:var(--danger)}
@media(prefers-color-scheme:dark){.btn.danger{background:#3b1212}}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}.btn.big{padding:15px;font-size:18px}.btn.wide{width:100%}
.input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:16px}
.input.ta{min-height:76px;resize:vertical;font-family:inherit}.input.num{width:110px;text-align:right}
.lbl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}.lbl .input{color:var(--fg);font-size:16px}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.brow:last-child{border-bottom:0}.brow:active{background:var(--line)}
.cnt{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.cnt.n,.legend .n,.bigcounts .n{color:var(--n)}.cnt.l,.legend .l,.bigcounts .l{color:var(--l)}.cnt.r,.legend .r,.bigcounts .r{color:var(--r)}.cnt.z{opacity:.25;font-weight:400}
.legend{display:flex;justify-content:flex-end;gap:0;font-size:11px;margin:0 14px 4px}.legend span{width:56px;text-align:right}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.bigcounts{display:flex;justify-content:space-around;margin:8px 0 14px;font-size:13px}.bigcounts div{display:flex;flex-direction:column;align-items:center}.bigcounts b{font-size:32px}
.brow{padding:10px 14px;border-bottom:1px solid var(--line)}.b1{font-weight:500}.b2{color:var(--mut);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{font-size:11px;background:var(--line);border-radius:6px;padding:2px 6px}.chip.warn{background:#fef3c7;color:#92400e}.chip.bad{background:#fee2e2;color:#991b1b}
.muted{color:var(--mut);font-size:14px}.muted.s{font-size:12px}.center{text-align:center}.pre{white-space:pre-wrap}
.card2{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}.srow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.srow:last-child{border:0}
.chart{width:100%;color:var(--fg)}
.overlay{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--sab));max-height:88dvh;overflow-y:auto}
.sheet.full{max-height:94dvh;height:94dvh}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.frow small{display:block;color:var(--mut);font-size:11px}
.frow input[type=checkbox]{width:24px;height:24px}
.sticky{position:sticky;bottom:-18px;background:var(--card);padding:10px 0;margin-top:10px}
.spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:6px auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sab));background:#111d;color:#fff;padding:10px 16px;border-radius:20px;z-index:99;font-size:14px}
.study{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.stop{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 8px) 12px 8px}
.scounts{font-weight:700;font-variant-numeric:tabular-nums;font-size:18px;display:flex;gap:10px}.scounts .n{color:var(--n)}.scounts .l{color:var(--l)}.scounts .r{color:var(--r)}
.cardscroll{flex:1;display:flex;min-height:0}.cardframe{flex:1;width:100%;border:0;background:transparent;color-scheme:light dark}
.sbottom{display:flex;gap:8px;padding:10px 12px calc(12px + var(--sab));background:var(--card);border-top:1px solid var(--line)}
.ans{flex:1;border:0;border-radius:12px;padding:8px 0 10px;color:#fff;font-size:16px;font-weight:600;display:flex;flex-direction:column;align-items:center}.ans small{font-size:11px;opacity:.9;font-weight:400}
.a1{background:#dc2626}.a2{background:#f59e0b}.a3{background:#16a34a}.a4{background:#2563eb}
.fmt .btn{min-width:44px}

.tog{display:inline-block;width:26px;color:var(--mut);padding:6px 0;margin:-6px 0}.dname{font-size:16px;line-height:1.25}
/* ---- Progresso ---- */
:root{--h0:#e5e7eb;--h1:#c7d2fe;--h2:#a5b4fc;--h3:#818cf8;--h4:#4f46e5;--c-new:#60a5fa;--c-lrn:#f87171;--c-young:#fbbf24;--c-mature:#34d399}
@media(prefers-color-scheme:dark){:root{--h0:#2c2c2e;--h1:#3730a3;--h2:#4f46e5;--h3:#6366f1;--h4:#a5b4fc}}
.row.between{justify-content:space-between}.row.between h3{margin:0}
.hero{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:24px;padding:22px 20px;margin:10px 0 12px;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899);box-shadow:0 10px 30px #8b5cf655}
.hero-l{display:flex;flex-direction:column;align-items:flex-start;min-width:0}.flame{font-size:40px;line-height:1}.streak{font-size:76px;font-weight:800;line-height:1;letter-spacing:-2px}
.streak-l{font-size:17px;font-weight:600;opacity:.95}.best{font-size:13px;opacity:.8;margin-top:6px}.badge2{margin-top:10px;background:#fff3;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600}
.hero-r{display:flex;flex-direction:column;align-items:center;flex:0 0 128px}.ring{width:128px;height:128px}.goal-edit{font-size:12px;opacity:.85;margin-top:2px}
.week{display:flex;justify-content:space-between;margin-top:10px}.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}.wd.today{color:var(--fg);font-weight:700}
.dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.dot.on{background:linear-gradient(135deg,#8b5cf6,#ec4899);border-color:transparent}.wd.today .dot:not(.on){border-color:#8b5cf6}
.heatwrap{display:flex;gap:6px;margin-top:10px}.heatdays{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:9px;color:var(--mut);padding-bottom:0}
.heat{flex:1;display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.hc{display:block;aspect-ratio:1;border-radius:4px;background:var(--h0)}.hc.l1{background:var(--h1)}.hc.l2{background:var(--h2)}.hc.l3{background:var(--h3)}.hc.l4{background:var(--h4)}.hc.fut{background:transparent}
.heatlegend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--mut);margin-top:10px}.heatlegend .hc{width:12px;height:12px;aspect-ratio:auto}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:8px 0}.stack>div{min-width:4px}
.c-new{background:var(--c-new)}.c-lrn{background:var(--c-lrn)}.c-young{background:var(--c-young)}.c-mature{background:var(--c-mature)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut)}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.tile{background:var(--card);border-radius:18px;padding:14px}
.tic{font-size:22px}.tbig{font-size:26px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}.tlab{font-size:12px;color:var(--mut)}
.btn.primary.share{margin-top:6px;background:linear-gradient(135deg,#6366f1,#ec4899)}
.sharebox{margin:6px 0 12px}.sharecv{width:100%;max-width:340px;display:block;margin:0 auto;border-radius:18px;box-shadow:0 8px 24px #0004}

/* ---- Baralhos ---- */
.dhero{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:22px;padding:18px 18px;margin:6px 0 12px;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed);box-shadow:0 8px 24px #4f46e544}
.dh-l{flex:1;min-width:0}.dh-big{font-size:46px;font-weight:800;line-height:1;letter-spacing:-1px}.dh-sub{font-size:15px;font-weight:600;margin:2px 0 10px}.dh-min{font-size:12px;opacity:.85;margin-top:6px}
.pbar{height:8px;border-radius:6px;background:#fff3;overflow:hidden}.pbar>div{height:100%;background:#fff;border-radius:6px}
.btn.dh-btn{background:#fff;color:#4338ca;font-weight:700;padding:14px 18px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;-webkit-overflow-scrolling:touch}
.chip2{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:7px 13px;font-size:13px;white-space:nowrap}.chip2.on{background:var(--pri);border-color:var(--pri);color:#fff}
.welcome{background:var(--card);border-radius:20px;padding:22px 18px;margin:12px 0;text-align:left}.welcome h2{margin:6px 0 10px}.wl-ic{font-size:44px}.welcome ol{padding-left:20px;color:var(--mut);line-height:1.5}.welcome li{margin-bottom:8px}
.drow{padding:12px 14px 12px;border-bottom:1px solid var(--line);cursor:pointer}.drow:last-child{border-bottom:0}.drow:active{background:var(--line)}
.drow.d0{background:var(--card)}.drow.d1,.drow.d2,.drow.d3,.drow.d4{background:var(--card)}
.drow.d0 .dtitle{font-weight:700;font-size:17px}.drow:not(.d0) .dtitle{font-size:15px}
.dline{display:flex;align-items:center;gap:2px}.dtitle{flex:1;line-height:1.25;overflow-wrap:anywhere}
.drow.idle .dtitle{color:var(--mut)}.drow.idle.d0 .dtitle{color:var(--fg)}
.tog{display:inline-block;width:26px;flex:0 0 26px;color:var(--mut);padding:6px 0;margin:-6px 0}
.play{flex:0 0 38px;width:38px;height:38px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:14px;padding-left:3px;margin-left:8px}.play:active{opacity:.7}
.dmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--mut)}
.pills{display:flex;gap:5px;flex-shrink:0}.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;font-variant-numeric:tabular-nums}
.pill.n{background:#dbeafe;color:#1d4ed8}.pill.l{background:#fee2e2;color:#b91c1c}.pill.r{background:#dcfce7;color:#15803d}.pill.ok{background:transparent;color:var(--mut);font-weight:500;padding:2px 0}
@media(prefers-color-scheme:dark){.pill.n{background:#1e3a8a;color:#bfdbfe}.pill.l{background:#7f1d1d;color:#fecaca}.pill.r{background:#14532d;color:#bbf7d0}}
.mbar{display:flex;height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:7px}.mbar i{display:block;height:100%}
.path{margin:-6px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 .btn{padding:12px 8px}

.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}.segb{border:0;border-radius:18px;padding:8px 13px;font-size:14px;background:var(--line);color:var(--fg);white-space:nowrap;font-weight:500}.segb.on{background:var(--pri);color:#fff}
.seg{flex-wrap:wrap;overflow:visible}.segb{padding:8px 12px}
/* ---- Loja ---- */
.tab{min-width:0}.tab span:last-child{font-size:10px;white-space:nowrap}
.shopnote{background:var(--card);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;color:var(--mut)}
.scard{background:var(--card);border-radius:18px;overflow:hidden;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.scov{height:92px;display:flex;align-items:center;justify-content:center;font-size:46px;position:relative}
.sbadge{position:absolute;top:10px;right:10px;background:#fff;color:#16a34a;font-size:12px;padding:3px 9px;border-radius:99px}
.sbody{padding:14px}.stitle{font-size:18px;font-weight:700}.ssub{color:var(--mut);font-size:14px;margin-top:2px}
.sdesc{font-size:14px;line-height:1.45;margin:10px 0}.smeta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13px;margin-bottom:12px}
.srow2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.srow2 .btn.primary{flex:1}.sprice{font-size:20px;font-weight:800;width:100%}
.linkbtn{background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline;padding:8px}
.code{background:var(--line);border-radius:10px;padding:10px;font-size:11px;overflow:auto;white-space:pre;max-height:220px}
.sheet .input{margin:0 0 8px}.sheet .btn.wide{margin-top:8px}
.steps{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.srow2 .btn{flex:1 1 auto}
/* ---- Loja v2: vitrine + página de produto ---- */
.shophead{font-size:15px;color:var(--mut);margin:2px 0 12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pcard{display:flex;flex-direction:column;text-align:left;background:var(--card);border:0;border-radius:16px;overflow:hidden;padding:0;color:var(--fg);box-shadow:0 1px 8px rgba(0,0,0,.07);font:inherit}
.pcard:active{transform:scale(.98)}
.pcov,.phero{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcov{aspect-ratio:4/3}.phero{aspect-ratio:16/10}
.pcov img,.phero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pemoji{font-size:38px}.phero .pemoji{font-size:84px}
.pbadge{position:absolute;top:8px;left:8px;background:#fff;color:#111;font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;z-index:1}
.pinfo{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.ptitle{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.psub{font-size:12px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pprice{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-top:4px}.pprice b{font-size:17px;font-weight:800}
.pprice s,.ph-price s,.pfoot s{color:var(--mut);font-size:12px}.pprice i,.ph-price i{font-style:normal;background:#dcfce7;color:#15803d;font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px}
.psample{margin-top:auto;padding-top:6px;font-size:11.5px;font-weight:600;color:#16a34a}
.ppage{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:pin .22s ease-out}
.ppage.out{animation:pout .22s ease-in forwards}
@keyframes pin{from{transform:translateX(100%)}to{transform:none}}@keyframes pout{to{transform:translateX(100%)}}
.pbar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 12px) 12px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.pbar span{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pback{border:0;background:none;color:var(--pri);font-size:17px;padding:6px 4px;white-space:nowrap}
.pscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pmain{padding:16px 16px 24px;max-width:720px;margin:0 auto}
.ph-title{font-size:23px;line-height:1.2;margin:0 0 6px}.ph-sub{color:var(--mut);margin:0 0 10px}
.ph-price{display:flex;align-items:baseline;gap:8px}.ph-price b{font-size:30px;font-weight:800}.ph-price s{font-size:16px}
.pfacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}

.pfacts span{font-size:20px}.pfacts b{font-size:13px}.pfacts small{font-size:11px;color:var(--mut)}
.pbtns{display:flex;flex-direction:column;gap:10px}.psamplebtn{background:#dcfce7;color:#15803d;font-weight:700}
.psec{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:14px}.psec h3{margin:0 0 8px;font-size:17px}.psec p{margin:6px 0;line-height:1.5;font-size:15px}

.pfaq{border-bottom:1px solid var(--line);padding:9px 0}.pfaq:last-child{border:0}.pfaq summary{font-weight:600;font-size:15px}.pfaq p{color:var(--mut)}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px calc(var(--sab) + 10px);background:var(--card);border-top:1px solid var(--line)}
.pfoot div{display:flex;flex-direction:column}.pfoot b{font-size:20px;font-weight:800}.pfoot .btn{flex:1;max-width:220px}
@media(prefers-color-scheme:dark){.pprice i,.ph-price i,.psamplebtn{background:#14532d;color:#bbf7d0}}
/* ---- Loja v3: capas e página de produto ---- */
.ic{display:inline-flex;width:20px;height:20px;flex:none}.ic svg{width:100%;height:100%}.ic.s{width:15px;height:15px}.ic.big{width:34px;height:34px}
.pcov.gen,.phero.gen{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 55%,#fff) 0%,transparent 60%),linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;flex-direction:column;align-items:stretch;justify-content:space-between;padding:10px 11px}

/* ---- Caderno de anotações ---- */
.cardscroll{position:relative}
.pencil{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mut);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:2;padding:0;opacity:.92}
.pencil svg,.nb-ic svg,.nb-mini svg,.nb-empty-ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pencil:active{transform:scale(.92)}
.pencil.has{background:#f59e0b;border-color:#f59e0b;color:#fff;opacity:1}
.pencil.has::after{content:'';position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #f59e0b}
.nb-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}.nb-head h3{margin:0}
.nb-ic{width:36px;height:36px;border-radius:11px;background:#fef3c7;color:#b45309;display:flex;align-items:center;justify-content:center}
.nb-lbl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
.nb-verso{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45;max-height:220px;overflow-y:auto;overflow-wrap:anywhere}
.nb-verso img{max-width:100%;height:auto;border-radius:6px}.nb-verso table{border-collapse:collapse;max-width:100%}.nb-verso td,.nb-verso th{border:1px solid var(--line);padding:4px 6px}
.nb-verso .cloze{font-weight:700;color:var(--pri)}.nb-verso ul,.nb-verso ol{padding-left:20px;margin:4px 0}
.nb-ta{min-height:110px;resize:vertical;font:inherit;line-height:1.45}
.nb-acts{margin-top:14px}
.nb-tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);color:var(--fg);border-radius:14px;padding:12px 14px;margin:0 0 10px;font:inherit}
.nb-tile:active{opacity:.75}
.nb-book{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#fde68a,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.nb-tt{flex:1;min-width:0}.nb-tt b{display:block;font-size:16px;font-weight:600}.nb-tt small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-chev{color:var(--mut);font-size:22px}
.nb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.nb-top h3{margin:0 0 2px}
.nb-chips{margin:10px 0 2px;overflow-x:auto;flex-wrap:nowrap}.nb-chips .chip2{white-space:nowrap}
.nb-list{margin-top:8px}
.nb-group{margin-top:14px}
.nb-gh{display:flex;align-items:baseline;gap:8px;padding:0 2px 8px;font-weight:700;font-size:15px}.nb-gh small{color:var(--mut);font-weight:400;font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nb-gh span{white-space:nowrap}
.nb-gh i{font-style:normal;font-size:12px;font-weight:700;background:var(--line);color:var(--mut);border-radius:10px;padding:1px 8px;margin-left:auto}
.nb-entry{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px 14px 12px;margin-bottom:12px}
.nb-entry .nb-verso{background:var(--card);max-height:none}
.nb-note{margin-top:4px}
.nb-note .nb-lbl{color:#b45309}
.nb-mini{display:inline-flex}.nb-mini svg{width:13px;height:13px}
.nb-txt{white-space:pre-wrap;font-size:15px;line-height:1.5;background:#fffbeb;color:#422006;border-left:3px solid #f59e0b;border-radius:4px 12px 12px 4px;padding:10px 12px;overflow-wrap:anywhere}
@media(prefers-color-scheme:dark){.nb-txt{background:#2a2112;color:#fde68a}.nb-ic{background:#3a2a0c;color:#fbbf24}.nb-note .nb-lbl{color:#fbbf24}}
.nb-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}.nb-foot .row{gap:6px}
.nb-empty{text-align:center;padding:40px 16px}.nb-empty b{display:block;font-size:17px;margin:12px 0 6px}
.nb-empty-ic{width:60px;height:60px;margin:0 auto;border-radius:18px;background:#fef3c7;color:#b45309;display:flex;align-items:center;justify-content:center}.nb-empty-ic svg{width:28px;height:28px}
.nb-verso .nb-k{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--pri);margin-top:10px}.nb-verso .nb-k:first-child{margin-top:0}
.nb-entry .nb-verso.clip{max-height:230px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent)}
.nb-more{border:0;background:none;color:var(--pri);font:inherit;font-size:14px;font-weight:600;padding:8px 2px 0}

</style>
</head>
<body>
<div id="app"><div style="padding:30px;text-align:center">Carregando…</div></div>
<script src="jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
